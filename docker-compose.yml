services:
  manufacturer-db:
    image: mysql:8.4
    container_name: asali-manufacturer-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: manufacturer_db
      MYSQL_USER: ii_user
      MYSQL_PASSWORD: ii_pass
    ports: ["3307:3306"]
    volumes:
      - manufacturer_data:/var/lib/mysql
      - ./databases/manufacturer:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ii_user", "-pii_pass"]
      interval: 5s
      timeout: 5s
      retries: 20

  distributor-db:
    image: mysql:8.4
    container_name: asali-distributor-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: distributor_db
      MYSQL_USER: ii_user
      MYSQL_PASSWORD: ii_pass
    ports: ["3308:3306"]
    volumes:
      - distributor_data:/var/lib/mysql
      - ./databases/distributor:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ii_user", "-pii_pass"]
      interval: 5s
      timeout: 5s
      retries: 20

  retailer-db:
    image: mysql:8.4
    container_name: asali-retailer-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: retailer_db
      MYSQL_USER: ii_user
      MYSQL_PASSWORD: ii_pass
    ports: ["3309:3306"]
    volumes:
      - retailer_data:/var/lib/mysql
      - ./databases/retailer:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ii_user", "-pii_pass"]
      interval: 5s
      timeout: 5s
      retries: 20

  scan-db:
    image: mysql:8.4
    container_name: asali-scan-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: item_scan_db
      MYSQL_USER: ii_user
      MYSQL_PASSWORD: ii_pass
    ports: ["3310:3306"]
    volumes:
      - scan_data:/var/lib/mysql
      - ./databases/item_scan:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ii_user", "-pii_pass"]
      interval: 5s
      timeout: 5s
      retries: 20

  authority-db:
    image: mysql:8.4
    container_name: asali-authority-db
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: authority_db
      MYSQL_USER: ii_user
      MYSQL_PASSWORD: ii_pass
    ports: ["3311:3306"]
    volumes:
      - authority_data:/var/lib/mysql
      - ./databases/authority:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "ii_user", "-pii_pass"]
      interval: 5s
      timeout: 5s
      retries: 20

  mediator:
    build: .
    container_name: asali-mediator
    depends_on:
      manufacturer-db: { condition: service_healthy }
      distributor-db: { condition: service_healthy }
      retailer-db: { condition: service_healthy }
      scan-db: { condition: service_healthy }
      authority-db: { condition: service_healthy }
    environment:
      MFG_HOST: manufacturer-db
      MFG_PORT: 3306
      DIST_HOST: distributor-db
      DIST_PORT: 3306
      RETAIL_HOST: retailer-db
      RETAIL_PORT: 3306
      SCAN_HOST: scan-db
      SCAN_PORT: 3306
      AUTH_HOST: authority-db
      AUTH_PORT: 3306
      DB_USER: ii_user
      DB_PASSWORD: ii_pass
      API_HOST: 0.0.0.0
      API_PORT: 8000
    ports: ["8000:8000"]
    command: ["python", "-m", "uvicorn", "mediator.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  manufacturer_data:
  distributor_data:
  retailer_data:
  scan_data:
  authority_data:
